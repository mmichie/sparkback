name: Python application

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:

    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Install dependencies
      run: uv sync --all-extras --locked
    - name: Check formatting with black
      run: uv run black --check .
    - name: Lint with flake8
      run: uv run flake8 .
    - name: Lint with pylint (errors and warnings)
      run: uv run pylint --recursive=y --disable=C,R sparkback tests examples

  test:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest supported Python and the newest release
        python-version: ["3.11", "3.15"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Install dependencies
      run: uv sync --all-extras --locked
    - name: Test with pytest
      run: uv run pytest
